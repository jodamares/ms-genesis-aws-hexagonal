spring:
  application:
    name: ms-organization-template
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:disabled}
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  webflux:
    base-path: /custom-path
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD:}
    pool:
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:2}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:8}
      max-idle-time: 30m
      validation-query: SELECT 1

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /custom-path

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

template:
  http-cache:
    enabled: ${TEMPLATE_HTTP_CACHE_ENABLED:true}
    key-list-max-age: ${TEMPLATE_HTTP_CACHE_KEY_LIST_MAX_AGE:5m}
    settings-app-max-age: ${TEMPLATE_HTTP_CACHE_SETTINGS_APP_MAX_AGE:5m}
    widgets-max-age: ${TEMPLATE_HTTP_CACHE_WIDGETS_MAX_AGE:5m}

logging:
  level:
    root: INFO
    com.tdp.ms: INFO
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql.QUERY: INFO

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false
